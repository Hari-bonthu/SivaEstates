name: Deploy Siva Telugu Estates to GitHub Pages

on:
  push:
    branches: ["main", "luxe-redesign", "luxury"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ─── 1. Build MAIN branch into ./dist (Production: https://hari-bonthu.github.io/SivaEstates/) ───
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main

      - name: Build main branch
        working-directory: repo-main
        run: |
          npm ci
          npm run build

      - name: Prepare Final Output Directory with Production Build
        run: |
          mkdir -p final-dist
          cp -r repo-main/dist/* final-dist/

      # ─── 2. Build LUXE-REDESIGN branch into ./dist/preview (Preview: https://hari-bonthu.github.io/SivaEstates/preview/) ───
      - name: Checkout luxe-redesign branch
        uses: actions/checkout@v4
        with:
          ref: luxe-redesign
          path: repo-preview

      - name: Build luxe-redesign branch
        working-directory: repo-preview
        run: |
          npm ci
          npm run build

      - name: Copy Luxury Preview Build to final-dist/preview
        run: |
          mkdir -p final-dist/preview
          cp -r repo-preview/dist/* final-dist/preview/

      # ─── 3. Upload Unified Pages Artifact ───
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './final-dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
